<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — PawRoute</title>
<meta name="description" content="Join the PawRoute waitlist or tell us about your grooming business.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="main">

<header class="sky page-hero" style="padding-bottom:40px;min-height:auto"><div class="rays" style="--ry:42%"></div><div class="halo" style="--hy:42%"></div><div class="clouds" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="sparks" aria-hidden="true"></div>
  <div class="wrap center"><h1>Let’s put your van <em>on the map</em></h1>
  <p class="lead">Tell us about your business and we will send an invite.</p></div>
</header>

<section style="padding-top:20px"><div class="wrap contact-grid">
  <form class="panel" id="contact-form">
    <h3 style="font-size:2rem">Join the waitlist</h3>
    <label for="name">Your name</label><input type="text" id="name" name="name" required placeholder="Mari Tamm" autocomplete="name">
    <label for="email">Email</label><input type="email" id="email" name="email" required placeholder="mari@happypaws.ee" autocomplete="email">
    <label for="biz">Salon or van name</label><input type="text" id="biz" name="biz" placeholder="Happy Paws Mobile">
    <label for="msg">What slows your day down?</label><textarea id="msg" name="msg" required placeholder="Dogs per day, your city, your biggest routing headache"></textarea>
    <button class="btn" type="submit" style="margin-top:1.6rem">Send</button>
  </form>
  <div class="facts">
    <div><h3>Email</h3><p>hello@pawroute.example</p></div>
    <div><h3>Based in</h3><p>Estonia, serving groomers across Europe.</p></div>
    <div><h3>Reply time</h3><p>Within one working day.</p></div>
  </div>
</div></section>

</main>
<script src="script.js"></script>
</body>
</html>
